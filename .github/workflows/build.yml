name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Unzip and Build
        run: |
          unzip project.zip
          
          AAPT2=$(find $ANDROID_HOME/build-tools -name aapt2 | sort | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -n 1)
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name android.jar | sort | tail -n 1)

          mkdir -p build/gen
          $AAPT2 compile --dir res -o build/res.zip
          $AAPT2 link -o build/app-unsigned.apk -I $ANDROID_JAR --manifest AndroidManifest.xml --java build/gen build/res.zip
          
          javac -source 8 -target 8 -classpath $ANDROID_JAR -d build/ src/com/voidaim/app/*.java build/gen/com/voidaim/app/R.java
          d8 --release --min-api 26 --lib $ANDROID_JAR --output build/ $(find build -name "*.class")
          
          cd build
          zip -q app-unsigned.apk classes.dex
          $ZIPALIGN -p -f 4 app-unsigned.apk app-aligned.apk
          
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug"
          $APKSIGNER sign --ks debug.keystore --ks-pass pass:android --out VoidAim.apk app-aligned.apk
          
      - uses: actions/upload-artifact@v4
        with:
          name: VoidAim-APK
          path: build/VoidAim.apk
